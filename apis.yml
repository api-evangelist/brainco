aid: brainco
name: BrainCo
description: >-
  BrainCo is a Harvard-innovation-lab-founded neurotechnology company building
  non-invasive brain-computer interface (BCI) hardware and the developer SDKs
  that surround it. Its consumer and research line centers on wearable EEG
  headbands - Focus, Focus1 and FocusCalm - that measure attention and stress
  from brainwave signals for education, wellness and biofeedback, alongside the
  BrainRobotics neuroprosthetic hand and the Revo (Revo1/Revo2/Revo3) family of
  dexterous robotic hands for robotics and embodied-AI developers. BrainCo ships
  first-party SDKs rather than a public REST API: the Crimson SDK for its
  portable EEG devices (Node.js and native/BLE), the Focus SDK for headband
  brainwave measurement, and the Revo Hand SDKs (Python and C/C++, distributed
  on PyPI and GitHub) that speak RS-485, CAN 2.0A/CAN FD, EtherCAT and Protobuf,
  plus ROS 2 drivers and URDF/MJCF/USD simulation assets. The company is backed
  by IDG Capital and operates in the healthcare, neurotech, robotics and
  education-technology sectors.
